# =====================================================================
# DomFlatcar guest configuration (PVH, direct kernel boot)
# =====================================================================
seclabel='system_u:system_r:domU_t'
name = "DomFlatcar"

# Flatcar Kernel（Uncompressed ARM64 image supplied directly from Dom0）
# Extract vmlinuz-a from QCOW2 and install it as linux-flatcar.
kernel = "/usr/lib/xen/boot/linux-flatcar"

memory = 2048
vcpus = 2
on_crash = 'preserve'

# Kernel commandline
# - root=LABEL=ROOT: Flatcar's ROOT partition (/dev/vda9)
# - mount.usr=PARTLABEL=USR-A: Mount /usr from the USR-A partition (/dev/vda3)
# - mount.usrflags=ro: /usr is read-only
# - console=hvc0: Xen Virtual Console
# - consoleblank=0: Disable console blanking
extra = "root=LABEL=ROOT rootflags=rw mount.usr=PARTLABEL=USR-A mount.usrflags=ro console=hvc0 consoleblank=0 flatcar.autologin"

# =====================================================================
# Virtio virtual devices (backend = QEMU on DomD)
# =====================================================================
virtio=[
'backend=DomD, type=virtio,device, transport=pci, bdf=0000:00:01.0, grant_usage=0, backend_type=qemu',
'backend=DomD, type=virtio,device, transport=pci, bdf=0000:00:05.0, grant_usage=0, backend_type=qemu',
]

device_model_args=[
# Storage: Give the Flatcar full disk image (GPT 9 partition)
'-device', 'virtio-blk-pci,scsi=off,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=1,drive=image',
'-drive', 'if=none,id=image,format=raw,file=/dev/STORAGE_PARTN',
# network
'-device', 'virtio-net-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=5,romfile=,netdev=net0,mac=08:00:27:ff:cb:d2',
'-netdev', 'type=tap,id=net0,ifname=vif-flatcar,br=xenbr0,script=no,downscript=no',
# debug
'-d', 'guest_errors',
'-monitor', 'telnet:127.0.0.1:1237,server,nowait',
'-global', 'virtio-mmio.force-legacy=false',
]
